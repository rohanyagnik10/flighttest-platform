controller:
  numExecutors: 0
  serviceType: LoadBalancer
  additionalPlugins:
    - job-dsl
    - github
    - pipeline-stage-view
  JCasC:
    configScripts:
      jobs: |
        jobs:
          - script: >
              pipelineJob('website') {
                properties {
                  pipelineTriggers {
                    triggers {
                      githubPush()
                    }
                  }
                }
                definition {
                  cpsScm {
                    scm {
                      git {
                        remote { url('https://github.com/rohanyagnik10/cambridge-aerospace-website.git') }
                        branch('*/main')
                      }
                    }
                    scriptPath('Jenkinsfile')
                  }
                }
              }
          - script: >
              pipelineJob('terraform') {
                properties {
                  pipelineTriggers {
                    triggers {
                      githubPush()
                    }
                  }
                }
                definition {
                  cpsScm {
                    scm {
                      git {
                        remote { url('https://github.com/rohanyagnik10/flighttest-platform.git') }
                        branch('*/main')
                      }
                    }
                    scriptPath('Jenkinsfile')
                  }
                }
              }

persistence:
  enabled: false

serviceAccountAgent:
  create: true
  name: jenkins-agent
