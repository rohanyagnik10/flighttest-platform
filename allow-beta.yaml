apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-beta
spec:
  podSelector:
    matchLabels:
      app: web
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: beta
      ports:
        - protocol: TCP
          port: 80